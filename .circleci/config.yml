version: 2.1

parameters:
  build_patched_codex:
    type: boolean
    default: false
  build_latest_patched_codex:
    type: boolean
    default: false
  store_latest_patched_artifact:
    type: boolean
    default: false
  require_warm_cache:
    type: boolean
    default: false

jobs:
  build-patched-codex:
    parameters:
      compat_id:
        type: string
      upstream_tag:
        type: string
      upstream_commit:
        type: string
      binding_sha256:
        type: string
      official_windows_npm_integrity:
        type: string
      store_artifact:
        type: boolean
        default: true
      require_warm_cache:
        type: boolean
        default: false
    machine:
      image: ubuntu-2604:current
    resource_class: large.gen3
    retention:
      caches: 7d
    environment:
      CARGO_BUILD_JOBS: "4"
      CARGO_HOME: /home/circleci/.cache/csa/cargo-home
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      CSA_TOOL_BIN: /home/circleci/.local/bin
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: "false"
      RUSTC_WRAPPER: /home/circleci/.local/bin/sccache
      RUSTUP_HOME: /home/circleci/.cache/csa/rustup
      SCCACHE_CACHE_SIZE: 4G
      SCCACHE_DIR: /home/circleci/.cache/csa/sccache
      TMPDIR: /home/circleci/csa-tmp
      XWIN_ACCEPT_LICENSE: "1"
      XWIN_ARCH: x86_64
      XWIN_CACHE_DIR: /home/circleci/.cache/csa/xwin
      XWIN_VARIANT: desktop
      XWIN_VERSION: "17"
    steps:
      - checkout

      - restore_cache:
          keys:
            - csa-cargo-home-v5-linux-amd64-1.95.0-codex-<< parameters.upstream_commit >>
            - csa-cargo-home-v5-linux-amd64-1.95.0-codex-

      - restore_cache:
          keys:
            - csa-rustup-v2-linux-amd64-rustup-1.29.0-rustc-59807616e1fa2540724bfbac14d7976d7e4a3860-host-x86_64-unknown-linux-gnu-target-x86_64-pc-windows-msvc

      - restore_cache:
          keys:
            - csa-xwin-v2-linux-amd64-cargo-xwin-0.23.0-msvc17-x86_64-pc-windows-msvc

      - restore_cache:
          keys:
            - csa-sccache-v4-linux-amd64-rustc-59807616e1fa2540724bfbac14d7976d7e4a3860-xwin-0.23.0-msvc17-llvm21.1.8-x86_64-pc-windows-msvc-<< parameters.binding_sha256 >>-<< parameters.upstream_commit >>
            - csa-sccache-v3-linux-amd64-1.95.0-xwin-0.23.0-codex-<< parameters.upstream_commit >>
            - csa-sccache-v3-linux-amd64-1.95.0-xwin-0.23.0-codex-

      - run:
          name: Build canonical patched Codex bundle
          no_output_timeout: 120m
          command: |
            set -euo pipefail
            compat_id="<< parameters.compat_id >>"
            upstream_tag="<< parameters.upstream_tag >>"
            upstream_commit="<< parameters.upstream_commit >>"
            manifest="$PWD/payload/codex/$compat_id/manifest.toml"
            if [[ ! -f "$manifest" ]]; then
              manifest="$PWD/payload/codex/native-join-p2/bindings/$compat_id/manifest.toml"
            fi
            test -f "$manifest"
            root="$HOME/csa-patched-codex/$compat_id"
            source="$root/source"
            cargo_target="$root/cargo-target"
            output="$PWD/.artifacts/$compat_id"
            stats="$root/sccache-stats.json"

            mkdir -p "$root" "$TMPDIR" "$CSA_TOOL_BIN" "$CARGO_HOME" "$RUSTUP_HOME" "$SCCACHE_DIR" "$XWIN_CACHE_DIR"
            git clone \
              --filter=blob:none \
              --no-checkout \
              --branch "$upstream_tag" \
              --single-branch \
              https://github.com/openai/codex.git \
              "$source"
            git -C "$source" checkout --detach "$upstream_commit"
            test "$(git -C "$source" rev-parse "refs/tags/$upstream_tag^{commit}")" = "$upstream_commit"

            build_args=(
              "$manifest"
              "$source"
              "$cargo_target"
              "$output"
              "<< parameters.official_windows_npm_integrity >>"
              "$stats"
            )
            build=(bash)
            if << parameters.require_warm_cache >>; then
              export CSA_MINIMUM_RUST_HIT_RATE=95
              build=(timeout 30m bash)
            fi
            "${build[@]}" scripts/build_patched_codex_bundle.sh "${build_args[@]}"

      - save_cache:
          key: csa-cargo-home-v5-linux-amd64-1.95.0-codex-<< parameters.upstream_commit >>
          paths:
            - /home/circleci/.cache/csa/cargo-home/registry/index
            - /home/circleci/.cache/csa/cargo-home/registry/cache
            - /home/circleci/.cache/csa/cargo-home/git/db

      - save_cache:
          key: csa-rustup-v2-linux-amd64-rustup-1.29.0-rustc-59807616e1fa2540724bfbac14d7976d7e4a3860-host-x86_64-unknown-linux-gnu-target-x86_64-pc-windows-msvc
          paths:
            - /home/circleci/.cache/csa/rustup

      - save_cache:
          key: csa-xwin-v2-linux-amd64-cargo-xwin-0.23.0-msvc17-x86_64-pc-windows-msvc
          paths:
            - /home/circleci/.cache/csa/xwin

      - save_cache:
          key: csa-sccache-v4-linux-amd64-rustc-59807616e1fa2540724bfbac14d7976d7e4a3860-xwin-0.23.0-msvc17-llvm21.1.8-x86_64-pc-windows-msvc-<< parameters.binding_sha256 >>-<< parameters.upstream_commit >>
          paths:
            - /home/circleci/.cache/csa/sccache

      - when:
          condition: << parameters.store_artifact >>
          steps:
            - store_artifacts:
                path: .artifacts/<< parameters.compat_id >>
                destination: << parameters.compat_id >>

workflows:
  csa-patched-latest:
    when:
      and:
        - << pipeline.parameters.build_latest_patched_codex >>
        - not: << pipeline.parameters.build_patched_codex >>
    jobs:
      - build-patched-codex:
          name: codex-0.149.0-cross-windows-msvc-latest
          compat_id: rust-v0.149.0-native-join-p3
          upstream_tag: rust-v0.149.0
          upstream_commit: 758ef40f50c1a458425c7cfbf1eb12cbc07af0b0
          binding_sha256: 07f465feceffa5811a8af80a6d18cc594c153e063d068e90328867c74315924c
          official_windows_npm_integrity: "sha512-i4dryj2Y1j+00Mb5n+0n71EYnTK9/KDc2cdFo/dXD0d1oTog2bhUssKDEIOnKmnEf51P0Z/HJTWvTKw/UHyOvQ=="
          store_artifact: << pipeline.parameters.store_latest_patched_artifact >>
          require_warm_cache: << pipeline.parameters.require_warm_cache >>
  csa-patched-build:
    when: << pipeline.parameters.build_patched_codex >>
    jobs:
      - build-patched-codex:
          name: codex-0.147.0-cross-windows-msvc
          compat_id: rust-v0.147.0-native-join-p2
          upstream_tag: rust-v0.147.0
          upstream_commit: be6e8eac029b183056b7e4402879f15d2c85f61b
          binding_sha256: 1d5f895313051195f2f06f3b6400912b0906e5f97ebce181e2816d2db289bc78
          official_windows_npm_integrity: "sha512-oT7Ss5fAPf2fiWE9QNURqZcQGAAawSVxmIUdgPzckq4KFZAM+pRz9JbM4Rr498CjtbNgTOjWvDJ+DXvIBSfOPA=="
      - build-patched-codex:
          name: codex-0.148.0-cross-windows-msvc
          compat_id: rust-v0.148.0-native-join-p2
          upstream_tag: rust-v0.148.0
          upstream_commit: 3ba0f711642a888aec92a611a3f3b2211157ff89
          binding_sha256: 8b0acfc159187b25bab0baac40efa470a60d1f220fc91d6fb7b8703e70184a99
          official_windows_npm_integrity: "sha512-/Jg8eYw0BqTGNUpnrzzWlK2kbu29NWg7t6pnUDEfxqpTUf+mK8r3okXQn60Zjbk9InYZ4d8SwSjrtOa+i5hSPw=="
      - build-patched-codex:
          name: codex-0.149.0-cross-windows-msvc
          compat_id: rust-v0.149.0-native-join-p3
          upstream_tag: rust-v0.149.0
          upstream_commit: 758ef40f50c1a458425c7cfbf1eb12cbc07af0b0
          binding_sha256: 07f465feceffa5811a8af80a6d18cc594c153e063d068e90328867c74315924c
          official_windows_npm_integrity: "sha512-i4dryj2Y1j+00Mb5n+0n71EYnTK9/KDc2cdFo/dXD0d1oTog2bhUssKDEIOnKmnEf51P0Z/HJTWvTKw/UHyOvQ=="
