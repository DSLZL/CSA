version: 2.1

parameters:
  build_patched_codex:
    type: boolean
    default: false
  compat_selector:
    description: "current or one exact compatibility ID from release/compatibility-index.json"
    type: string
    default: current
  target:
    type: string
    default: x86_64-pc-windows-msvc
  store_artifact:
    type: boolean
    default: true
  require_warm_cache:
    type: boolean
    default: false

  # Backward-compatible entry point. It resolves through the same data-driven
  # current pointer and contains no version identity in this YAML.
  build_latest_patched_codex:
    type: boolean
    default: false
  store_latest_patched_artifact:
    type: boolean
    default: false

  # The former boolean silently expanded every historical version in static
  # YAML. It is retained only to fail closed with an actionable message.
  build_all_compat:
    type: boolean
    default: false

jobs:
  reject-invalid-request:
    machine:
      image: ubuntu-2604:current
    resource_class: medium
    steps:
      - run:
          name: Reject ambiguous or deprecated patched build request
          command: |
            printf '%s\n' \
              'Invalid patched Codex build request.' \
              '' \
              'Supported modes:' \
              '  build_patched_codex=true' \
              '  compat_selector=current|<exact-compat-id>' \
              '  target=x86_64-pc-windows-msvc' \
              '' \
              'Backward-compatible current build:' \
              '  build_latest_patched_codex=true' \
              '' \
              'build_all_compat is intentionally rejected. Enumerate reviewed IDs with:' \
              '  python scripts/compat_catalog.py list --target x86_64-pc-windows-msvc' \
              'and trigger one pipeline per exact ID. This preserves one request -> one heavy build.' >&2
            exit 64

  build-patched-codex:
    parameters:
      compat_selector:
        type: string
      target:
        type: string
      store_artifact:
        type: boolean
        default: true
      require_warm_cache:
        type: boolean
        default: false
    machine:
      image: ubuntu-2604:current
    resource_class: large.gen3
    retention:
      caches: 7d
    environment:
      # Bind string/boolean parameters as environment data. Never interpolate
      # caller-controlled selector text into shell source.
      CSA_COMPAT_SELECTOR_PARAM: "<< parameters.compat_selector >>"
      CSA_TARGET_PARAM: "<< parameters.target >>"
      CSA_REQUIRE_WARM_CACHE_PARAM: "<< parameters.require_warm_cache >>"
      CARGO_HOME: /home/circleci/.cache/csa/cargo-home
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      CSA_RUNTIME_CACHE: /home/circleci/.cache/csa/official-runtime
      CSA_TOOL_BIN: /home/circleci/.local/bin
      CSA_TOOL_CACHE: /home/circleci/.cache/csa/tools
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: "false"
      RUSTUP_HOME: /home/circleci/.cache/csa/rustup
      SCCACHE_CACHE_SIZE: 4G
      SCCACHE_DIR: /home/circleci/.cache/csa/sccache
      TMPDIR: /home/circleci/csa-tmp
      XWIN_ACCEPT_LICENSE: "1"
      XWIN_CACHE_DIR: /home/circleci/.cache/csa/xwin
    steps:
      - checkout

      - run:
          name: Resolve one exact reviewed compatibility
          command: |
            set -euo pipefail
            umask 077
            mkdir -p .artifacts/resolution
            python3 scripts/compat_catalog.py resolve \
              --repository . \
              --selector "$CSA_COMPAT_SELECTOR_PARAM" \
              --target "$CSA_TARGET_PARAM" \
              --output .artifacts/resolution/compatibility.json \
              --bash-env "$BASH_ENV"
            source "$BASH_ENV"
            cp "$CSA_BUILD_PROFILE" .artifacts/resolution/build-profile.json
            cp "$CSA_RUNTIME_LOCK" .artifacts/resolution/runtime-lock.json
            cp "$CSA_MANIFEST" .artifacts/resolution/manifest.toml
            printf '%s\n' "$CSA_UPSTREAM_COMMIT" > .artifacts/resolution/upstream-commit.txt
            {
              echo "compat_id=$CSA_COMPAT_ID"
              echo "upstream_tag=$CSA_UPSTREAM_TAG"
              echo "upstream_commit=$CSA_UPSTREAM_COMMIT"
              echo "manifest_sha256=$CSA_MANIFEST_SHA256"
              echo "build_profile_sha256=$CSA_BUILD_PROFILE_SHA256"
              echo "runtime_lock_sha256=$CSA_RUNTIME_LOCK_SHA256"
            }

      # Cargo registry/git data is safe to share across reviewed compatibility
      # versions. Keep the previous v5 prefix as a migration fallback.
      - restore_cache:
          keys:
            - csa-cargo-home-v6-linux-amd64-{{ checksum ".artifacts/resolution/build-profile.json" }}
            - csa-cargo-home-v5-linux-amd64-1.95.0-codex-

      # Rustup, xwin, exact tool downloads, and official runtime archives are
      # independently versioned by reviewed lock files.
      - restore_cache:
          keys:
            - csa-rustup-v3-linux-amd64-{{ checksum ".artifacts/resolution/build-profile.json" }}
            - csa-rustup-v2-linux-amd64-rustup-1.29.0-rustc-59807616e1fa2540724bfbac14d7976d7e4a3860-host-x86_64-unknown-linux-gnu-target-x86_64-pc-windows-msvc
      - restore_cache:
          keys:
            - csa-xwin-v3-linux-amd64-{{ checksum ".artifacts/resolution/build-profile.json" }}
            - csa-xwin-v2-linux-amd64-cargo-xwin-0.23.0-msvc17-x86_64-pc-windows-msvc
      - restore_cache:
          keys:
            - csa-build-tools-v1-linux-amd64-{{ checksum ".artifacts/resolution/build-profile.json" }}
      - restore_cache:
          keys:
            - csa-official-runtime-v1-{{ checksum ".artifacts/resolution/runtime-lock.json" }}
            - csa-official-runtime-v1-

      # sccache remains the compiler object cache. The reviewed profile and
      # compatibility index create a new generation; old v5/v3 caches remain
      # available as safe migration fallbacks.
      - restore_cache:
          keys:
            - csa-sccache-v6-linux-amd64-{{ checksum ".artifacts/resolution/build-profile.json" }}-{{ checksum ".artifacts/resolution/manifest.toml" }}-{{ checksum ".artifacts/resolution/upstream-commit.txt" }}
            - csa-sccache-v5-linux-amd64-rustc-59807616e1fa2540724bfbac14d7976d7e4a3860-xwin-0.23.0-msvc17-llvm21.1.8-x86_64-pc-windows-msvc-
            - csa-sccache-v3-linux-amd64-1.95.0-xwin-0.23.0-codex-

      - run:
          name: Clone exact reviewed upstream Codex source
          no_output_timeout: 10m
          command: |
            set -euo pipefail
            source "$BASH_ENV"
            root="$HOME/csa-patched-codex/$CSA_COMPAT_ID"
            source_root="$root/source"
            rm -rf "$root"
            mkdir -p "$root" "$TMPDIR" "$CSA_TOOL_BIN" "$CSA_TOOL_CACHE" \
              "$CSA_RUNTIME_CACHE" "$CARGO_HOME" "$RUSTUP_HOME" \
              "$SCCACHE_DIR" "$XWIN_CACHE_DIR"
            chmod 0700 "$TMPDIR"

            for attempt in 1 2 3; do
              rm -rf "$source_root"
              if git clone \
                --filter=blob:none \
                --no-checkout \
                --branch "$CSA_UPSTREAM_TAG" \
                --single-branch \
                https://github.com/openai/codex.git \
                "$source_root"; then
                break
              fi
              if [[ "$attempt" == 3 ]]; then
                echo "Pinned upstream clone failed after $attempt attempts." >&2
                exit 1
              fi
              sleep $((attempt * 5))
            done
            git -C "$source_root" checkout --detach "$CSA_UPSTREAM_COMMIT"
            test "$(git -C "$source_root" rev-parse "refs/tags/$CSA_UPSTREAM_TAG^{commit}")" = "$CSA_UPSTREAM_COMMIT"
            test "$(git -C "$source_root" rev-parse HEAD)" = "$CSA_UPSTREAM_COMMIT"

            mkdir -p "$PWD/.artifacts/bundle" "$PWD/.artifacts/diagnostics"
            {
              printf 'export CSA_BUILD_ROOT=%q\n' "$root"
              printf 'export CSA_SOURCE=%q\n' "$source_root"
              printf 'export CSA_CARGO_TARGET=%q\n' "$root/cargo-target"
              printf 'export CSA_OUTPUT=%q\n' "$PWD/.artifacts/bundle/$CSA_COMPAT_ID"
              printf 'export CSA_SCCACHE_STATS=%q\n' "$PWD/.artifacts/diagnostics/$CSA_COMPAT_ID-sccache.json"
            } >> "$BASH_ENV"

      - run:
          name: Build canonical patched Codex CLI bundle
          no_output_timeout: 20m
          command: |
            set -euo pipefail
            source "$BASH_ENV"
            build=(timeout 50m bash)
            if [[ "$CSA_REQUIRE_WARM_CACHE_PARAM" == true ]]; then
              export CSA_MINIMUM_RUST_HIT_RATE=95
              build=(timeout 30m bash)
            elif [[ "$CSA_REQUIRE_WARM_CACHE_PARAM" != false ]]; then
              echo "require_warm_cache must be true or false" >&2
              exit 2
            fi
            started_at="$(date +%s)"
            "${build[@]}" scripts/build_patched_codex_bundle.sh \
              "$PWD/.artifacts/resolution/compatibility.json" \
              "$CSA_SOURCE" \
              "$CSA_CARGO_TARGET" \
              "$CSA_OUTPUT" \
              "$CSA_SCCACHE_STATS"
            finished_at="$(date +%s)"
            echo "canonical_bundle_seconds=$((finished_at - started_at))"

      - run:
          name: Record exact candidate provenance
          command: |
            set -euo pipefail
            source "$BASH_ENV"
            mkdir -p .artifacts/candidates
            python3 scripts/compat_catalog.py candidate \
              --repository . \
              --resolution "$PWD/.artifacts/resolution/compatibility.json" \
              --artifact "$CSA_OUTPUT/bin/$CSA_ARTIFACT_FILENAME" \
              --output "$PWD/.artifacts/candidates/$CSA_COMPAT_ID-$CSA_BUILD_TARGET.json" \
              --provider circleci \
              --pipeline "$CIRCLE_PIPELINE_ID" \
              --job "$CIRCLE_WORKFLOW_JOB_ID" \
              --source-commit "$CIRCLE_SHA1"

      - save_cache:
          key: csa-cargo-home-v6-linux-amd64-{{ checksum ".artifacts/resolution/build-profile.json" }}
          paths:
            - /home/circleci/.cache/csa/cargo-home/registry/index
            - /home/circleci/.cache/csa/cargo-home/registry/cache
            - /home/circleci/.cache/csa/cargo-home/git/db
      - save_cache:
          key: csa-rustup-v3-linux-amd64-{{ checksum ".artifacts/resolution/build-profile.json" }}
          paths:
            - /home/circleci/.cache/csa/rustup
      - save_cache:
          key: csa-xwin-v3-linux-amd64-{{ checksum ".artifacts/resolution/build-profile.json" }}
          paths:
            - /home/circleci/.cache/csa/xwin
      - save_cache:
          key: csa-build-tools-v1-linux-amd64-{{ checksum ".artifacts/resolution/build-profile.json" }}
          paths:
            - /home/circleci/.cache/csa/tools
      - save_cache:
          key: csa-official-runtime-v1-{{ checksum ".artifacts/resolution/runtime-lock.json" }}
          paths:
            - /home/circleci/.cache/csa/official-runtime
      - save_cache:
          key: csa-sccache-v6-linux-amd64-{{ checksum ".artifacts/resolution/build-profile.json" }}-{{ checksum ".artifacts/resolution/manifest.toml" }}-{{ checksum ".artifacts/resolution/upstream-commit.txt" }}
          paths:
            - /home/circleci/.cache/csa/sccache

      - when:
          condition: << parameters.store_artifact >>
          steps:
            - store_artifacts:
                path: .artifacts
                destination: patched-codex

workflows:
  csa-patched-selected:
    when:
      and:
        - << pipeline.parameters.build_patched_codex >>
        - not: << pipeline.parameters.build_latest_patched_codex >>
        - not: << pipeline.parameters.build_all_compat >>
    jobs:
      - build-patched-codex:
          name: patched-codex-selected
          compat_selector: << pipeline.parameters.compat_selector >>
          target: << pipeline.parameters.target >>
          store_artifact: << pipeline.parameters.store_artifact >>
          require_warm_cache: << pipeline.parameters.require_warm_cache >>

  csa-patched-latest:
    when:
      and:
        - << pipeline.parameters.build_latest_patched_codex >>
        - not: << pipeline.parameters.build_patched_codex >>
        - not: << pipeline.parameters.build_all_compat >>
    jobs:
      - build-patched-codex:
          name: patched-codex-current
          compat_selector: current
          target: << pipeline.parameters.target >>
          store_artifact: << pipeline.parameters.store_latest_patched_artifact >>
          require_warm_cache: << pipeline.parameters.require_warm_cache >>

  csa-patched-invalid-request:
    when:
      or:
        - << pipeline.parameters.build_all_compat >>
        - and:
            - << pipeline.parameters.build_patched_codex >>
            - << pipeline.parameters.build_latest_patched_codex >>
    jobs:
      - reject-invalid-request
