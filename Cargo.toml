[package]
name = "csa"
version = "0.1.2"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Fail-closed manager for a side-by-side CSA build"
build = "build.rs"

[dependencies]
directories = "6.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
toml = "0.9"
ureq = { version = "3.4", default-features = false, features = ["rustls"] }

[lints.rust]
unsafe_code = "forbid"
