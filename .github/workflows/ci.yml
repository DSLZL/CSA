name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:
    inputs:
      full_payload:
        description: Run the disposable upstream Codex patch/test/build lane
        required: false
        default: false
        type: boolean

concurrency:
  group: csa-ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: "false"

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "26"
          package-manager-cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b # 1.95.0 branch
        with:
          components: clippy,rustfmt
      - name: Set up Cargo downloads and sccache
        uses: ./.github/actions/setup-codex-rust-cache
        with:
          cache-scope: csa-manager-${{ hashFiles('Cargo.lock') }}
          toolchain: "1.95.0"
      - name: Rust quality
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --all-targets
      - name: Rust cache statistics
        if: always()
        continue-on-error: true
        run: sccache --show-stats
      - name: Launcher and package tools
        run: |
          node --check npm/meta/bin/csa.js
          node --check scripts/stage_npm_packages.mjs
          node scripts/test_npm_launcher.mjs
          python scripts/test_verify_patch_payload.py
          python scripts/test_release_tools.py
      - name: Immutable compatibility entries
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/compat-base"
          git archive "$BASE_SHA" payload/codex | tar -x -C "$RUNNER_TEMP/compat-base"
          python scripts/compatibility_audit.py immutability \
            --baseline "$RUNNER_TEMP/compat-base/payload/codex" \
            --candidate "$GITHUB_WORKSPACE/payload/codex"

  node-compat:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: |
          node --check npm/meta/bin/csa.js
          node --check scripts/stage_npm_packages.mjs
          node scripts/test_npm_launcher.mjs

  platform:
    # EXPERIMENTAL: OpenAI-style fast PR path. Full platform verification runs on default-branch pushes or manual runs.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch)
    name: ${{ matrix.id }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: win32-x64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            binary: csa.exe
          - id: linux-x64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            binary: csa
          - id: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            binary: csa
          - id: darwin-x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            binary: csa
          - id: darwin-arm64
            runner: macos-15
            target: aarch64-apple-darwin
            binary: csa
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Configure ephemeral roots
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "csa"
          @(
            "CSA_ROOT=$root"
            "CARGO_TARGET_DIR=$(Join-Path $root 'cargo-target')"
            "HOME=$(Join-Path $root 'home')"
            "CODEX_HOME=$(Join-Path $root 'codex-home')"
            "NPM_CONFIG_CACHE=$(Join-Path $root 'npm-cache')"
            "NPM_CONFIG_PREFIX=$(Join-Path $root 'npm-prefix')"
          ) | Add-Content -Path $env:GITHUB_ENV -Encoding utf8
          @('artifact', 'activation', 'codex-home', 'home', 'npm-cache', 'npm-prefix', 'tarballs') |
            ForEach-Object { New-Item -ItemType Directory -Force (Join-Path $root $_) | Out-Null }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "26"
          package-manager-cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b # 1.95.0 branch
        with:
          components: clippy
      - name: Set up Cargo downloads and sccache
        uses: ./.github/actions/setup-codex-rust-cache
        with:
          cache-scope: csa-manager-${{ hashFiles('Cargo.lock') }}
          toolchain: "1.95.0"
      - name: Native Rust lane
        run: |
          cargo test --all-targets --target ${{ matrix.target }}
          cargo clippy --workspace --all-targets --all-features --target ${{ matrix.target }} -- -D warnings
          cargo build --release --target ${{ matrix.target }}
      - name: Rust cache statistics
        if: always()
        continue-on-error: true
        run: sccache --show-stats
      - name: Launcher contract
        run: node scripts/test_npm_launcher.mjs
      - name: Stage npm packages
        run: node scripts/stage_npm_packages.mjs --out "${{ runner.temp }}/csa/stage" --binary "${{ matrix.id }}=${{ runner.temp }}/csa/cargo-target/${{ matrix.target }}/release/${{ matrix.binary }}"
      - name: Pack npm candidates
        run: |
          npm pack "${{ runner.temp }}/csa/stage/meta" --json --pack-destination "${{ runner.temp }}/csa/tarballs"
          npm pack "${{ runner.temp }}/csa/stage/platforms/${{ matrix.id }}" --json --pack-destination "${{ runner.temp }}/csa/tarballs"
      - name: Temporary-prefix install
        run: |
          npm install --prefix "${{ runner.temp }}/csa/npm-prefix" --offline --no-audit --no-fund "${{ runner.temp }}/csa/tarballs/dslzl-csa-${{ matrix.id }}-0.1.0.tgz" "${{ runner.temp }}/csa/tarballs/dslzl-csa-0.1.0.tgz"
          node scripts/test_installed_launcher.mjs "${{ runner.temp }}/csa/npm-prefix"
          npm uninstall --prefix "${{ runner.temp }}/csa/npm-prefix" --offline --no-audit --no-fund "@dslzl/csa" "@dslzl/csa-${{ matrix.id }}"
      - name: Record platform artifact
        run: python scripts/ci_release.py platform --repository "${{ github.workspace }}" --platform "${{ matrix.id }}" --manager "${{ runner.temp }}/csa/cargo-target/${{ matrix.target }}/release/${{ matrix.binary }}" --meta-tarball "${{ runner.temp }}/csa/tarballs/dslzl-csa-0.1.0.tgz" --npm-tarball "${{ runner.temp }}/csa/tarballs/dslzl-csa-${{ matrix.id }}-0.1.0.tgz" --isolation-root "${{ runner.temp }}/csa" --output "${{ runner.temp }}/csa/artifact/${{ matrix.id }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: platform-${{ matrix.id }}
          path: ${{ runner.temp }}/csa/artifact
          if-no-files-found: error
          retention-days: 1

  payload:
    name: Exact Codex payload
    if: github.event_name == 'workflow_dispatch' && inputs.full_payload
    runs-on: windows-2025
    steps:
      - name: Configure payload root
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "csa-payload"
          "PAYLOAD_ROOT=$root" | Add-Content -Path $env:GITHUB_ENV -Encoding utf8
          New-Item -ItemType Directory -Force $root | Out-Null
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b # 1.95.0 branch
      - name: Set up Cargo downloads and sccache
        uses: ./.github/actions/setup-codex-rust-cache
        with:
          cache-scope: codex-3ba0f711642a888aec92a611a3f3b2211157ff89
          toolchain: "1.95.0"
      - name: Clone exact upstream tag
        shell: pwsh
        run: |
          git clone --filter=blob:none --no-checkout --branch rust-v0.148.0 --single-branch https://github.com/openai/codex.git "$env:PAYLOAD_ROOT/source"
          git -C "$env:PAYLOAD_ROOT/source" checkout --detach 3ba0f711642a888aec92a611a3f3b2211157ff89
      - name: Apply, test, and build disposable payload
        shell: pwsh
        run: |
          python scripts/run_patch_contract.py `
            --manifest "$env:GITHUB_WORKSPACE/payload/codex/rust-v0.148.0-native-join-p2/manifest.toml" `
            --source "$env:PAYLOAD_ROOT/source" `
            --cargo-target "$env:PAYLOAD_ROOT/cargo-target" `
            --output "$env:PAYLOAD_ROOT/payload-result.json"
      - name: Rust cache statistics
        if: always()
        continue-on-error: true
        run: sccache --show-stats
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: patched-codex-cli-windows-x64
          path: |
            ${{ runner.temp }}/csa-payload/payload-result.json
            ${{ runner.temp }}/csa-payload/cargo-target/x86_64-pc-windows-msvc/release/codex.exe
          if-no-files-found: error
          retention-days: 1
