name: Release patched Codex CLI

on:
  workflow_dispatch:
    inputs:
      compat_selector:
        description: "current or one exact compatibility ID from release/compatibility-index.json"
        required: true
        default: current
        type: string
      target:
        description: Reviewed patched Codex target
        required: true
        default: x86_64-pc-windows-msvc
        type: string
      publish:
        description: Publish the formal GitHub Release after a successful build
        required: true
        default: true
        type: boolean
      validation_run_id:
        description: "Optional exact validation run ID; otherwise use the newest matching default-branch run"
        required: false
        type: string

concurrency:
  group: csa-patched-codex-release-${{ inputs.target }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: "false"

jobs:
  build:
    name: Build production patched Codex CLI
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      actions: write
      contents: read
    outputs:
      compat_id: ${{ steps.resolve.outputs.compat_id }}
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      codex_version: ${{ steps.resolve.outputs.codex_version }}
      upstream_tag: ${{ steps.resolve.outputs.upstream_tag }}
      upstream_commit: ${{ steps.resolve.outputs.upstream_commit }}
      release_enabled: ${{ steps.resolve.outputs.release_enabled }}
      artifact_asset: ${{ steps.guard.outputs.artifact_asset }}
      artifact_sha256: ${{ steps.finalize.outputs.artifact_sha256 }}
    steps:
      - name: Configure isolated build roots
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/csa-patched-codex"
          {
            echo "PATCHED_CODEX_ROOT=$root"
            echo "SOURCE_ROOT=$root/source"
            echo "CARGO_TARGET_DIR=$root/cargo-target"
            echo "CARGO_HOME=$root/cache/cargo-home"
            echo "CSA_TOOL_BIN=$root/tools/bin"
            echo "CSA_TOOL_CACHE=$root/cache/tools"
            echo "CSA_RUNTIME_CACHE=$root/cache/unused-official-runtime"
            echo "RUSTUP_HOME=$root/cache/rustup"
            echo "SCCACHE_DIR=$root/cache/sccache-bootstrap"
            echo "SCCACHE_RELEASE_DIR=$root/cache/sccache"
            echo "TMPDIR=$root/tmp"
            echo "XWIN_CACHE_DIR=$root/cache/xwin"
            echo "HOME=$root/home"
            echo "CODEX_HOME=$root/codex-home"
            echo "RESOLUTION_JSON=$root/resolution.json"
            echo "BUNDLE_ROOT=$root/bundle"
            echo "SCCACHE_STATS=$root/sccache-stats.json"
            echo "ARTIFACT_PATH=$root/bundle/bin/codex.exe"
            echo "VALIDATION_EVIDENCE_ROOT=$root/validation-evidence"
            echo "VALIDATION_RUNS_JSON=$root/validation-runs.json"
          } >> "$GITHUB_ENV"
          mkdir -p "$root/home" "$root/codex-home" "$root/tmp" "$root/validation-evidence"
          chmod 0700 "$root/tmp"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - id: resolve
        name: Resolve committed compatibility, runtime, and build authority
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PUBLISH_REQUESTED: ${{ inputs.publish }}
          REQUESTED_COMPAT_SELECTOR: ${{ inputs.compat_selector }}
          REQUESTED_TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]]; then
            echo "Patched Codex Releases must be dispatched from default branch '$DEFAULT_BRANCH'; selected '$GITHUB_REF_NAME'." >&2
            exit 2
          fi
          release_args=()
          if [[ "$PUBLISH_REQUESTED" == "true" ]]; then
            release_args+=(--require-release)
          fi
          python scripts/compat_catalog.py resolve \
            --repository . \
            --selector "$REQUESTED_COMPAT_SELECTOR" \
            --target "$REQUESTED_TARGET" \
            "${release_args[@]}" \
            --output "$RESOLUTION_JSON" \
            --github-output "$GITHUB_OUTPUT"
          python scripts/compat_catalog.py validate --repository .

      - id: validation
        name: Select successful exact-commit validation
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VALIDATION_RUN_ID: ${{ inputs.validation_run_id }}
        run: |
          set -euo pipefail
          gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/validate-patched-codex.yml/runs?branch=$DEFAULT_BRANCH&head_sha=$GITHUB_SHA&status=success&per_page=100" \
            > "$VALIDATION_RUNS_JSON"
          selection_args=()
          if [[ -n "$REQUESTED_VALIDATION_RUN_ID" ]]; then
            [[ "$REQUESTED_VALIDATION_RUN_ID" =~ ^[1-9][0-9]*$ ]] || {
              echo "validation_run_id must be a positive integer" >&2
              exit 2
            }
            selection_args+=(--requested-run-id "$REQUESTED_VALIDATION_RUN_ID")
          fi
          python scripts/validation_evidence.py select-run \
            --runs "$VALIDATION_RUNS_JSON" \
            --csa-commit "$GITHUB_SHA" \
            --default-branch "$DEFAULT_BRANCH" \
            "${selection_args[@]}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Download exact validation evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: patched-codex-validation-${{ steps.resolve.outputs.compat_id }}
          path: ${{ env.VALIDATION_EVIDENCE_ROOT }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.validation.outputs.validation_run_id }}

      - name: Verify exact validation evidence
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validation_evidence.py verify \
            --repository . \
            --resolution "$RESOLUTION_JSON" \
            --test-report "$VALIDATION_EVIDENCE_ROOT/test-report.json" \
            --evidence "$VALIDATION_EVIDENCE_ROOT/validation-result.json" \
            --csa-commit "$GITHUB_SHA" \
            --workflow-run-id '${{ steps.validation.outputs.validation_run_id }}' \
            --workflow-run-attempt '${{ steps.validation.outputs.validation_run_attempt }}'

      - name: Restore rolling Cargo downloads
        id: cargo-cache
        continue-on-error: true
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ${{ env.CARGO_HOME }}/registry/index
            ${{ env.CARGO_HOME }}/registry/cache
            ${{ env.CARGO_HOME }}/git/db
          key: csa-patched-codex-cargo-v8-linux-X64

      - name: Restore exact Rust toolchain
        id: rustup-cache
        continue-on-error: true
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ env.RUSTUP_HOME }}
          key: csa-rustup-v3-linux-X64-${{ steps.resolve.outputs.build_profile_sha256 }}
          restore-keys: csa-rustup-v2-linux-X64-rustup-1.29.0-rustc-59807616e1fa2540724bfbac14d7976d7e4a3860-host-x86_64-unknown-linux-gnu-target-x86_64-pc-windows-msvc

      - name: Restore exact xwin SDK
        id: xwin-cache
        continue-on-error: true
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ env.XWIN_CACHE_DIR }}
          key: csa-xwin-v3-linux-X64-${{ steps.resolve.outputs.build_profile_sha256 }}
          restore-keys: csa-xwin-v2-linux-X64-cargo-xwin-0.23.0-msvc17-x86_64-pc-windows-msvc

      - name: Restore exact build tools
        id: tools-cache
        continue-on-error: true
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ env.CSA_TOOL_CACHE }}
          key: csa-build-tools-v1-linux-X64-${{ steps.resolve.outputs.build_profile_sha256 }}

      - name: Restore release compiler cache
        id: release-compiler-cache
        continue-on-error: true
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ env.SCCACHE_RELEASE_DIR }}
          key: csa-patched-codex-sccache-v9-linux-X64-${{ steps.resolve.outputs.build_target }}-rust-${{ steps.resolve.outputs.rust_toolchain }}-release-${{ steps.resolve.outputs.build_profile_sha256 }}-upstream-${{ steps.resolve.outputs.upstream_commit }}-patch-${{ steps.resolve.outputs.manifest_sha256 }}
          restore-keys: |
            csa-patched-codex-sccache-v9-linux-X64-${{ steps.resolve.outputs.build_target }}-rust-${{ steps.resolve.outputs.rust_toolchain }}-release-${{ steps.resolve.outputs.build_profile_sha256 }}-
            csa-patched-codex-sccache-v8-linux-X64

      - name: Clone exact reviewed upstream source
        shell: bash
        run: |
          set -euo pipefail
          source_root="$(realpath -m "$SOURCE_ROOT")"
          runner_temp="$(realpath -m "$RUNNER_TEMP")"
          workspace="$(realpath -m "$GITHUB_WORKSPACE")"
          case "$source_root/" in
            "$runner_temp/"*) ;;
            *)
              echo "Codex source must live below RUNNER_TEMP: $source_root" >&2
              exit 2
              ;;
          esac
          case "$source_root/" in
            "$workspace/"*)
              echo "Codex source must not live inside the CSA repository: $source_root" >&2
              exit 2
              ;;
          esac
          for attempt in 1 2 3; do
            rm -rf "$SOURCE_ROOT"
            if git clone \
              --filter=blob:none \
              --no-checkout \
              --branch '${{ steps.resolve.outputs.upstream_tag }}' \
              --single-branch \
              https://github.com/openai/codex.git \
              "$SOURCE_ROOT"; then
              break
            fi
            if [[ "$attempt" == 3 ]]; then
              echo "Pinned upstream clone failed after $attempt attempts." >&2
              exit 1
            fi
            sleep $((attempt * 5))
          done
          git -C "$SOURCE_ROOT" checkout --detach '${{ steps.resolve.outputs.upstream_commit }}'
          test "$(git -C "$SOURCE_ROOT" rev-parse 'refs/tags/${{ steps.resolve.outputs.upstream_tag }}^{commit}')" = '${{ steps.resolve.outputs.upstream_commit }}'
          test "$(git -C "$SOURCE_ROOT" rev-parse HEAD)" = '${{ steps.resolve.outputs.upstream_commit }}'

      - name: Prepare pinned build tools
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build_patched_codex_bundle.sh tools \
            "$RESOLUTION_JSON" \
            "$SOURCE_ROOT" \
            "$CARGO_TARGET_DIR" \
            "$BUNDLE_ROOT" \
            "$SCCACHE_STATS"

      - name: Save exact build tools
        if: steps.tools-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ env.CSA_TOOL_CACHE }}
          key: csa-build-tools-v1-linux-X64-${{ steps.resolve.outputs.build_profile_sha256 }}

      - name: Prepare exact Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build_patched_codex_bundle.sh rust \
            "$RESOLUTION_JSON" \
            "$SOURCE_ROOT" \
            "$CARGO_TARGET_DIR" \
            "$BUNDLE_ROOT" \
            "$SCCACHE_STATS"

      - name: Save exact Rust toolchain
        if: steps.rustup-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ env.RUSTUP_HOME }}
          key: csa-rustup-v3-linux-X64-${{ steps.resolve.outputs.build_profile_sha256 }}

      - name: Prepare exact xwin SDK and LLVM toolchain
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build_patched_codex_bundle.sh xwin \
            "$RESOLUTION_JSON" \
            "$SOURCE_ROOT" \
            "$CARGO_TARGET_DIR" \
            "$BUNDLE_ROOT" \
            "$SCCACHE_STATS"

      - name: Save exact xwin SDK
        if: steps.xwin-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ env.XWIN_CACHE_DIR }}
          key: csa-xwin-v3-linux-X64-${{ steps.resolve.outputs.build_profile_sha256 }}

      - name: Build canonical patched Codex CLI bundle
        shell: bash
        env:
          SCCACHE_DIR: ${{ env.SCCACHE_RELEASE_DIR }}
          CSA_SCCACHE_CACHE_SIZE: 6G
          CSA_SCCACHE_PROFILE: release
          CSA_MINIMUM_RUST_HIT_RATE: 95
        run: |
          set -euo pipefail
          bash scripts/build_patched_codex_bundle.sh release \
            "$RESOLUTION_JSON" \
            "$SOURCE_ROOT" \
            "$CARGO_TARGET_DIR" \
            "$BUNDLE_ROOT" \
            "$SCCACHE_STATS"

      - name: Replace rolling caches after build
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for key in \
            csa-patched-codex-cargo-v8-linux-X64 \
            csa-patched-codex-sccache-v9-linux-X64-${{ steps.resolve.outputs.build_target }}-rust-${{ steps.resolve.outputs.rust_toolchain }}-release-${{ steps.resolve.outputs.build_profile_sha256 }}-upstream-${{ steps.resolve.outputs.upstream_commit }}-patch-${{ steps.resolve.outputs.manifest_sha256 }}; do
            gh cache delete "$key" \
              --repo "$GITHUB_REPOSITORY" \
              --ref "$GITHUB_REF" || true
          done

      - name: Save final Cargo downloads
        continue-on-error: true
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ${{ env.CARGO_HOME }}/registry/index
            ${{ env.CARGO_HOME }}/registry/cache
            ${{ env.CARGO_HOME }}/git/db
          key: csa-patched-codex-cargo-v8-linux-X64

      - name: Save release compiler cache
        continue-on-error: true
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ env.SCCACHE_RELEASE_DIR }}
          key: csa-patched-codex-sccache-v9-linux-X64-${{ steps.resolve.outputs.build_target }}-rust-${{ steps.resolve.outputs.rust_toolchain }}-release-${{ steps.resolve.outputs.build_profile_sha256 }}-upstream-${{ steps.resolve.outputs.upstream_commit }}-patch-${{ steps.resolve.outputs.manifest_sha256 }}

      - id: finalize
        name: Finalize production manifest from the GitHub-built CLI
        shell: bash
        run: |
          set -euo pipefail
          staged_root="$PATCHED_CODEX_ROOT/finalized-repository"
          mkdir -p "$staged_root"
          cp -a payload "$staged_root/"
          staged_manifest="$staged_root/${{ steps.resolve.outputs.manifest_path }}"
          python scripts/compat_release.py finalize \
            --manifest "$staged_manifest" \
            --artifact "$ARTIFACT_PATH"
          actual_sha="$(sha256sum "$ARTIFACT_PATH" | cut -d ' ' -f 1)"
          echo "STAGED_MANIFEST=$staged_manifest" >> "$GITHUB_ENV"
          echo "artifact_sha256=$actual_sha" >> "$GITHUB_OUTPUT"

      - name: Reverify clean source and finalized production manifest
        shell: bash
        run: |
          set -euo pipefail
          git -C "$SOURCE_ROOT" reset --hard '${{ steps.resolve.outputs.upstream_commit }}'
          git -C "$SOURCE_ROOT" clean -ffd
          python scripts/verify_patch_payload.py \
            --manifest "$STAGED_MANIFEST" \
            --source "$SOURCE_ROOT" \
            --artifact "$ARTIFACT_PATH"

      - name: Pack formal compatibility assets
        shell: bash
        run: |
          set -euo pipefail
          python scripts/compat_release.py pack \
            --manifest "$STAGED_MANIFEST" \
            --artifact "$ARTIFACT_PATH" \
            --source-commit "$GITHUB_SHA" \
            --output "$PATCHED_CODEX_ROOT/release-assets"

      - id: guard
        name: Enforce exact CLI-only local Release asset set
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify_release_asset_set.py local \
            --root "$PATCHED_CODEX_ROOT/release-assets" \
            --expected-executable '${{ steps.resolve.outputs.artifact_asset }}'
          echo 'artifact_asset=${{ steps.resolve.outputs.artifact_asset }}' >> "$GITHUB_OUTPUT"

      - name: Upload release candidate assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: patched-codex-cli-release-${{ steps.resolve.outputs.compat_id }}
          path: ${{ runner.temp }}/csa-patched-codex/release-assets
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish:
    name: Publish ${{ needs.build.outputs.release_tag }}
    needs: build
    if: inputs.publish && needs.build.outputs.release_enabled == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: patched-codex-cli-release-${{ needs.build.outputs.compat_id }}
          path: ${{ runner.temp }}/patched-codex-release-assets

      - name: Recheck exact local asset authority
        run: |
          set -euo pipefail
          python scripts/verify_release_asset_set.py local \
            --root "$RUNNER_TEMP/patched-codex-release-assets" \
            --expected-executable '${{ needs.build.outputs.artifact_asset }}'

      - name: Create or validate annotated compatibility tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.release_tag }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          create_tag_object() {
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/tags" \
              -f tag="$TAG" \
              -f message="$TAG" \
              -f object="$RELEASE_SHA" \
              -f type=commit \
              --jq .sha
          }
          git fetch --force --tags origin
          if git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null; then
            existing="$(git rev-parse "$TAG^{commit}")"
            if [[ "$existing" != "$RELEASE_SHA" ]]; then
              release_draft="$(gh api --paginate \
                "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
                --jq ".[] | select(.tag_name == \"$TAG\") | .draft")"
              case "$release_draft" in
                false)
                  echo "Published release $TAG remains anchored at $existing; verifying its assets."
                  ;;
                true|"")
                  tag_sha="$(create_tag_object)"
                  gh api --method PATCH \
                    "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" \
                    -f sha="$tag_sha" \
                    -F force=true >/dev/null
                  ;;
                *)
                  echo "Release lookup returned an invalid draft state for $TAG: $release_draft" >&2
                  exit 2
                  ;;
              esac
            fi
          else
            tag_sha="$(create_tag_object)"
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$TAG" \
              -f sha="$tag_sha" >/dev/null
          fi

      - name: Create or resume draft, upload idempotently, verify, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.release_tag }}
          CODEX_VERSION: ${{ needs.build.outputs.codex_version }}
          UPSTREAM_TAG: ${{ needs.build.outputs.upstream_tag }}
          UPSTREAM_COMMIT: ${{ needs.build.outputs.upstream_commit }}
          COMPAT_ID: ${{ needs.build.outputs.compat_id }}
          PRODUCTION_CODEX_SHA256: ${{ needs.build.outputs.artifact_sha256 }}
          EXPECTED_EXECUTABLE: ${{ needs.build.outputs.artifact_asset }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/patched-codex-release-assets"
          notes="$RUNNER_TEMP/release-notes.md"
          remote="$RUNNER_TEMP/release.json"
          load_release() {
            local release_id
            if ! release_id="$(gh release view "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --json databaseId \
              --jq .databaseId 2>/dev/null)"; then
              return 1
            fi
            gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" > "$remote"
          }
          cat > "$notes" <<EOF
          Patched Codex CLI ${CODEX_VERSION}

          Compatibility ID: ${COMPAT_ID}
          Upstream: ${UPSTREAM_TAG} (${UPSTREAM_COMMIT})
          Production executable SHA-256: ${PRODUCTION_CODEX_SHA256}
          Built independently from the reviewed upstream source by GitHub Actions.

          This compatibility Release contains exactly one Codex executable product: the patched Codex CLI.
          It does not publish Codex App, Codex Desktop, app-server, exec-server, MCP server, or other Codex binaries.
          The remaining assets are the fail-closed compatibility payload, provenance descriptor, and checksums required by CSA Manager.
          EOF

          if load_release; then
            existing_draft="$(python -c 'import json,sys; print(str(json.load(open(sys.argv[1]))["draft"]).lower())' "$remote")"
            existing_prerelease="$(python -c 'import json,sys; print(str(json.load(open(sys.argv[1]))["prerelease"]).lower())' "$remote")"
            [[ "$existing_prerelease" == false ]] || { echo "Existing release is a prerelease." >&2; exit 2; }
            if [[ "$existing_draft" == false ]]; then
              python scripts/verify_release_asset_set.py remote \
                --root "$root" \
                --expected-executable "$EXPECTED_EXECUTABLE" \
                --release-json "$remote"
              echo "Published release already exists with the exact reviewed asset set."
              exit 0
            fi
            gh release edit "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --title "CSA patched Codex CLI ${CODEX_VERSION}" \
              --notes-file "$notes"
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --draft \
              --title "CSA patched Codex CLI ${CODEX_VERSION}" \
              --notes-file "$notes"
          fi

          mapfile -t assets < <(find "$root" -maxdepth 1 -type f -print | sort)
          (( ${#assets[@]} > 0 )) || { echo "No release assets were produced." >&2; exit 2; }

          # A failed earlier upload may have left an extra asset in the draft.
          # Reconcile the draft to the local reviewed inventory before replacing
          # expected names. Published releases are never mutated above.
          declare -A expected=()
          for asset in "${assets[@]}"; do
            expected["$(basename "$asset")"]=1
          done
          load_release
          mapfile -t remote_names < <(python - "$remote" <<'PY'
          import json
          import sys
          release = json.load(open(sys.argv[1], encoding="utf-8"))
          for asset in release.get("assets", []):
              name = asset.get("name")
              if isinstance(name, str):
                  print(name)
          PY
          )
          for name in "${remote_names[@]}"; do
            if [[ -z "${expected[$name]+x}" ]]; then
              gh release delete-asset "$TAG" "$name" \
                --repo "$GITHUB_REPOSITORY" \
                --yes
            fi
          done

          gh release upload "$TAG" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

          verified=false
          for attempt in {1..12}; do
            load_release
            if python scripts/verify_release_asset_set.py remote \
              --root "$root" \
              --expected-executable "$EXPECTED_EXECUTABLE" \
              --release-json "$remote"; then
              verified=true
              break
            fi
            sleep 5
          done
          [[ "$verified" == true ]] || { echo "GitHub never exposed the exact uploaded asset digest set." >&2; exit 2; }

          gh release edit "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
