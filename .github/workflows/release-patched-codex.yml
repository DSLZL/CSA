name: Release patched Codex CLI

on:
  workflow_dispatch:
    inputs:
      compat_id:
        description: Reviewed standalone Native Join compatibility ID
        required: true
        default: "rust-v0.149.0-native-join-p3"
        type: string
      official_windows_npm_integrity:
        description: Exact @openai/codex Windows x64 npm integrity
        required: true
        type: string
      accepted_codex_sha256:
        description: SHA-256 of codex.exe accepted from the CircleCI bundle on local Windows
        required: true
        type: string

concurrency:
  group: csa-patched-codex-release-${{ inputs.compat_id }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: "false"

jobs:
  build:
    name: Build exact patched Codex CLI
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    outputs:
      compat_id: ${{ steps.manifest.outputs.compat_id }}
      release_tag: ${{ steps.manifest.outputs.release_tag }}
      codex_version: ${{ steps.manifest.outputs.codex_version }}
      upstream_tag: ${{ steps.manifest.outputs.upstream_tag }}
      upstream_commit: ${{ steps.manifest.outputs.upstream_commit }}
      artifact_asset: ${{ steps.guard.outputs.artifact_asset }}

    steps:
      - name: Configure isolated build roots
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "csa-patched-codex"
          $source = Join-Path $root "source"
          $temp = Join-Path $root "tmp"
          @(
            "PATCHED_CODEX_ROOT=$root"
            "SOURCE_ROOT=$source"
            "CARGO_TARGET_DIR=$(Join-Path $root 'cargo-target')"
            "CARGO_HOME=$(Join-Path $root 'cache/cargo-home')"
            "CSA_TOOL_BIN=$(Join-Path $root 'tools')"
            "RUSTUP_HOME=$(Join-Path $root 'cache/rustup')"
            "SCCACHE_DIR=$(Join-Path $root 'cache/sccache')"
            "TMPDIR=$temp"
            "XWIN_CACHE_DIR=$(Join-Path $root 'cache/xwin')"
          ) | Add-Content -Path $env:GITHUB_ENV -Encoding utf8

          $runnerTemp = [IO.Path]::GetFullPath($env:RUNNER_TEMP)
          $workspace = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE)
          $source = [IO.Path]::GetFullPath($source)
          $separator = [IO.Path]::DirectorySeparatorChar

          if (-not $source.StartsWith("$runnerTemp$separator", [StringComparison]::OrdinalIgnoreCase)) {
            throw "Codex source must live below RUNNER_TEMP: $source"
          }
          if ($source.Equals($workspace, [StringComparison]::OrdinalIgnoreCase) -or
              $source.StartsWith("$workspace$separator", [StringComparison]::OrdinalIgnoreCase)) {
            throw "Codex source must not live inside the CSA repository: $source"
          }

          New-Item -ItemType Directory -Force `
            $root, `
            (Join-Path $root "home"), `
            (Join-Path $root "codex-home"), `
            $temp | Out-Null

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - id: manifest
        name: Resolve reviewed compatibility manifest
        shell: pwsh
        env:
          REQUESTED_COMPAT_ID: ${{ inputs.compat_id }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if ($env:GITHUB_REF_NAME -ne $env:DEFAULT_BRANCH) {
            throw "Patched Codex Releases must be dispatched from the default branch '$env:DEFAULT_BRANCH'; selected ref is '$env:GITHUB_REF_NAME'."
          }

          @'
          import os
          import re
          import hashlib
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path("scripts").resolve()))
          from verify_patch_payload import _load_payload

          compat_id = os.environ["REQUESTED_COMPAT_ID"].strip()
          if not re.fullmatch(r"[A-Za-z0-9._-]+", compat_id):
              raise SystemExit(f"unsafe compatibility ID: {compat_id!r}")

          manifest_path = Path("payload") / "codex" / compat_id / "manifest.toml"
          if not manifest_path.is_file():
              raise SystemExit(f"reviewed compatibility manifest does not exist: {manifest_path}")

          payload = _load_payload(manifest_path)
          manifest = payload.manifest
          if manifest.get("compat_id") != compat_id:
              raise SystemExit(
                  f"compatibility ID mismatch: requested={compat_id}, manifest={manifest.get('compat_id')}"
              )
          if payload.source_schema != 1 or payload.family_id is not None:
              raise SystemExit("formal p3 release requires a standalone schema-1 payload")
          if manifest.get("patch_set_version") != 6:
              raise SystemExit("formal p3 release requires reviewed patch_set_version = 6")

          target = manifest["build_target"]
          toolchain = manifest["rust_toolchain"]
          artifact = manifest["artifacts"][target]

          # The current reviewed CSA compatibility lane is intentionally CLI-only
          # and Windows x64. Fail closed instead of silently building other Codex products.
          if target != "x86_64-pc-windows-msvc":
              raise SystemExit(
                  f"release-patched-codex.yml currently permits only x86_64-pc-windows-msvc; manifest requested {target}"
              )
          if artifact["filename"] != "codex.exe":
              raise SystemExit(
                  f"CLI-only release requires artifact filename codex.exe; manifest requested {artifact['filename']}"
              )
          if toolchain != "1.95.0":
              raise SystemExit(
                  f"workflow is SHA-pinned to the Rust 1.95.0 toolchain action; manifest requested {toolchain}"
              )

          values = {
              "compat_id": compat_id,
              "release_tag": f"compat-{compat_id}",
              "codex_version": manifest["codex_version"],
              "upstream_tag": manifest["upstream_tag"],
              "upstream_commit": manifest["upstream_commit"],
              "rust_toolchain": toolchain,
              "build_target": target,
              "artifact_filename": artifact["filename"],
              "manifest_path": manifest_path.as_posix(),
              "binding_sha256": hashlib.sha256(manifest_path.read_bytes()).hexdigest(),
          }

          output = Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a", encoding="utf-8") as f:
              for key, value in values.items():
                  f.write(f"{key}={value}\n")
          '@ | python -

      - name: Configure exact CLI artifact path
        shell: pwsh
        run: |
          $artifact = Join-Path $env:PATCHED_CODEX_ROOT "bundle/bin/${{ steps.manifest.outputs.artifact_filename }}"
          "ARTIFACT_PATH=$artifact" | Add-Content -Path $env:GITHUB_ENV -Encoding utf8

      - name: Restore Cargo downloads
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ${{ env.CARGO_HOME }}/registry/index
            ${{ env.CARGO_HOME }}/registry/cache
            ${{ env.CARGO_HOME }}/git/db
          key: csa-cargo-home-v5-linux-X64-1.95.0-codex-${{ steps.manifest.outputs.upstream_commit }}
          restore-keys: csa-cargo-home-v5-linux-X64-1.95.0-codex-
      - name: Restore exact Rust toolchain
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ env.RUSTUP_HOME }}
          key: csa-rustup-v2-linux-X64-rustup-1.29.0-rustc-59807616e1fa2540724bfbac14d7976d7e4a3860-host-x86_64-unknown-linux-gnu-target-x86_64-pc-windows-msvc
      - name: Restore exact xwin SDK
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ env.XWIN_CACHE_DIR }}
          key: csa-xwin-v2-linux-X64-cargo-xwin-0.23.0-msvc17-x86_64-pc-windows-msvc
      - name: Restore exact compiler cache
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: csa-sccache-v5-linux-X64-rustc-59807616e1fa2540724bfbac14d7976d7e4a3860-xwin-0.23.0-msvc17-llvm21.1.8-x86_64-pc-windows-msvc-${{ steps.manifest.outputs.binding_sha256 }}-${{ steps.manifest.outputs.upstream_commit }}

      - name: Clone exact reviewed upstream source
        shell: pwsh
        run: |
          & git clone `
            --filter=blob:none `
            --no-checkout `
            --branch "${{ steps.manifest.outputs.upstream_tag }}" `
            --single-branch `
            https://github.com/openai/codex.git `
            "$env:SOURCE_ROOT"

          if ($LASTEXITCODE -ne 0) {
            throw "git clone failed with exit code $LASTEXITCODE"
          }

          & git -C "$env:SOURCE_ROOT" checkout --detach "${{ steps.manifest.outputs.upstream_commit }}"
          if ($LASTEXITCODE -ne 0) {
            throw "git checkout failed with exit code $LASTEXITCODE"
          }

          $peeled = (& git -C "$env:SOURCE_ROOT" rev-parse "refs/tags/${{ steps.manifest.outputs.upstream_tag }}^{commit}").Trim()
          if (-not $peeled.Equals("${{ steps.manifest.outputs.upstream_commit }}", [StringComparison]::OrdinalIgnoreCase)) {
            throw "upstream tag peeled to $peeled, expected ${{ steps.manifest.outputs.upstream_commit }}"
          }

      - name: Build canonical patched Codex bundle
        env:
          HOME: ${{ runner.temp }}/csa-patched-codex/home
          CODEX_HOME: ${{ runner.temp }}/csa-patched-codex/codex-home
        run: |
          bash scripts/build_patched_codex_bundle.sh \
            "$GITHUB_WORKSPACE/${{ steps.manifest.outputs.manifest_path }}" \
            "$SOURCE_ROOT" \
            "$CARGO_TARGET_DIR" \
            "$PATCHED_CODEX_ROOT/bundle" \
            "${{ inputs.official_windows_npm_integrity }}" \
            "$PATCHED_CODEX_ROOT/sccache-stats.json"

      - name: Match locally accepted CircleCI executable
        shell: pwsh
        env:
          ACCEPTED_CODEX_SHA256: ${{ inputs.accepted_codex_sha256 }}
        run: |
          $expected = $env:ACCEPTED_CODEX_SHA256.Trim().ToLowerInvariant()
          if ($expected -notmatch '^[0-9a-f]{64}$') {
            throw "accepted_codex_sha256 must be lowercase 64-hex"
          }
          $actual = (Get-FileHash -LiteralPath $env:ARTIFACT_PATH -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "formal codex.exe SHA-256 $actual differs from locally accepted CircleCI SHA-256 $expected"
          }

      - name: Stage formal Release manifest without modifying the reviewed entry
        shell: pwsh
        run: |
          & git -C "$env:SOURCE_ROOT" reset --hard "${{ steps.manifest.outputs.upstream_commit }}"
          if ($LASTEXITCODE -ne 0) { throw "git reset failed" }
          & git -C "$env:SOURCE_ROOT" clean -ffd
          if ($LASTEXITCODE -ne 0) { throw "git clean failed" }

          $payloadParent = Join-Path $env:PATCHED_CODEX_ROOT "release-payload"
          $stagedPayload = Join-Path $payloadParent "${{ steps.manifest.outputs.compat_id }}"
          New-Item -ItemType Directory -Force $payloadParent | Out-Null
          Copy-Item `
            -LiteralPath "$env:GITHUB_WORKSPACE/payload/codex/${{ steps.manifest.outputs.compat_id }}" `
            -Destination $stagedPayload `
            -Recurse

          $stagedManifest = Join-Path $stagedPayload "manifest.toml"

          # finalize() binds the formal compat-* download URL plus the exact
          # codex.exe size/hash in the disposable staged copy only.
          python scripts/compat_release.py finalize `
            --manifest "$stagedManifest" `
            --artifact "$env:ARTIFACT_PATH"

          python scripts/verify_patch_payload.py `
            --manifest "$stagedManifest" `
            --source "$env:SOURCE_ROOT" `
            --artifact "$env:ARTIFACT_PATH"

          "STAGED_MANIFEST=$stagedManifest" | Add-Content -Path $env:GITHUB_ENV -Encoding utf8

      - name: Pack formal compatibility assets
        shell: pwsh
        run: |
          python scripts/compat_release.py pack `
            --manifest "$env:STAGED_MANIFEST" `
            --artifact "$env:ARTIFACT_PATH" `
            --source-commit "$env:GITHUB_SHA" `
            --output "$env:PATCHED_CODEX_ROOT/release-assets"

      - id: guard
        name: Enforce CLI-only executable asset set
        shell: pwsh
        run: |
          $root = "$env:PATCHED_CODEX_ROOT/release-assets"
          $descriptorPath = Join-Path $root "compatibility-release.json"
          if (-not (Test-Path -LiteralPath $descriptorPath -PathType Leaf)) {
            throw "compatibility-release.json is missing"
          }

          $descriptor = Get-Content -LiteralPath $descriptorPath -Raw | ConvertFrom-Json
          $expected = [string]$descriptor.artifact.asset
          $executables = @(Get-ChildItem -LiteralPath $root -File | Where-Object {
            $_.Extension -in @(".exe", ".app", ".msi", ".dmg")
          })

          if ($executables.Count -ne 1) {
            throw "CLI-only Release must contain exactly one executable artifact; found $($executables.Count)"
          }
          if ($executables[0].Name -ne $expected) {
            throw "unexpected executable asset '$($executables[0].Name)'; expected '$expected'"
          }
          if ($executables[0].Name -match "app-server|desktop|codex-app|exec-server|mcp") {
            throw "forbidden non-CLI Codex product in Release assets: $($executables[0].Name)"
          }

          "artifact_asset=$expected" | Add-Content -Path $env:GITHUB_OUTPUT -Encoding utf8

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: patched-codex-cli-release-${{ steps.manifest.outputs.compat_id }}
          path: ${{ runner.temp }}/csa-patched-codex/release-assets
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: patched-codex-cli-bundle-${{ steps.manifest.outputs.compat_id }}
          path: ${{ runner.temp }}/csa-patched-codex/bundle
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish:
    name: Publish ${{ needs.build.outputs.release_tag }}
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: patched-codex-cli-release-${{ needs.build.outputs.compat_id }}
          path: ${{ runner.temp }}/patched-codex-release-assets

      - name: Recheck CLI-only Release contents
        env:
          EXPECTED_EXECUTABLE: ${{ needs.build.outputs.artifact_asset }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/patched-codex-release-assets"

          python - "$root" "$EXPECTED_EXECUTABLE" <<'PY'
          import json
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          expected = sys.argv[2]
          descriptor = json.loads((root / "compatibility-release.json").read_text(encoding="utf-8"))

          if descriptor["artifact"]["asset"] != expected:
              raise SystemExit("descriptor artifact does not match build output")

          forbidden = ("app-server", "desktop", "codex-app", "exec-server", "mcp")
          executable_suffixes = {".exe", ".app", ".msi", ".dmg"}
          executables = [
              p.name for p in root.iterdir()
              if p.is_file() and p.suffix.lower() in executable_suffixes
          ]

          if executables != [expected]:
              raise SystemExit(
                  f"CLI-only Release must contain exactly {expected!r} as its executable asset; got {executables!r}"
              )
          if any(token in expected.lower() for token in forbidden):
              raise SystemExit(f"forbidden non-CLI Codex product: {expected}")
          PY

      - name: Create or validate annotated compatibility tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.release_tag }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin

          if git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null; then
            existing="$(git rev-parse "$TAG^{commit}")"
            if [ "$existing" != "$RELEASE_SHA" ]; then
              echo "Tag $TAG already points to $existing, not $RELEASE_SHA." >&2
              exit 2
            fi
          else
            tag_sha="$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/tags" \
              -f tag="$TAG" \
              -f message="$TAG" \
              -f object="$RELEASE_SHA" \
              -f type=commit \
              --jq .sha)"
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$TAG" \
              -f sha="$tag_sha" >/dev/null
          fi

      - name: Publish patched Codex CLI Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.release_tag }}
          CODEX_VERSION: ${{ needs.build.outputs.codex_version }}
          UPSTREAM_TAG: ${{ needs.build.outputs.upstream_tag }}
          UPSTREAM_COMMIT: ${{ needs.build.outputs.upstream_commit }}
          COMPAT_ID: ${{ needs.build.outputs.compat_id }}
          ACCEPTED_CODEX_SHA256: ${{ inputs.accepted_codex_sha256 }}
        run: |
          set -euo pipefail

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite it." >&2
            exit 2
          fi

          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          Patched Codex CLI ${CODEX_VERSION}

          Compatibility ID: ${COMPAT_ID}
          Upstream: ${UPSTREAM_TAG} (${UPSTREAM_COMMIT})
          Locally accepted CircleCI codex.exe SHA-256: ${ACCEPTED_CODEX_SHA256}

          This compatibility Release contains exactly one Codex executable product: the patched Codex CLI.
          It does not publish Codex App, Codex Desktop, app-server, exec-server, MCP server, or other Codex binaries.
          The remaining flat assets are CSA compatibility metadata, the reviewed patch payload, provenance, and checksums required for fail-closed installation and verification.
          EOF

          mapfile -t assets < <(find "$RUNNER_TEMP/patched-codex-release-assets" -maxdepth 1 -type f -print | sort)

          gh release create "$TAG" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "CSA patched Codex CLI ${CODEX_VERSION}" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
