name: Build one patched Codex target

on:
  workflow_call:
    inputs:
      artifact_filename:
        required: true
        type: string
      compat_id:
        required: true
        type: string
      manifest_path:
        required: true
        type: string
      retention_days:
        required: false
        default: 14
        type: number
      runner:
        required: true
        type: string
      rust_toolchain:
        required: true
        type: string
      source_commit:
        required: true
        type: string
      target:
        required: true
        type: string
      upstream_commit:
        required: true
        type: string
      upstream_tag:
        required: true
        type: string

env:
  CARGO_INCREMENTAL: "0"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_TERM_COLOR: always
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: "false"
  SCCACHE_GHA_ENABLED: "on"
  SCCACHE_GHA_RW_MODE: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && 'READ_WRITE' || 'READ_ONLY' }}
  SCCACHE_GHA_VERSION: csa-patched-codex-v1
  SCCACHE_IDLE_TIMEOUT: "0"

jobs:
  build:
    name: Build ${{ inputs.target }}
    runs-on: ${{ inputs.runner }}
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.source_commit }}
          persist-credentials: false

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"

      - name: Configure isolated build roots
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/csa-patched-codex-${{ inputs.target }}"
          {
            echo "SOURCE_ROOT=$root/source"
            echo "CARGO_TARGET_DIR=$root/cargo-target"
            echo "TARGET_BUNDLE=$root/bundle"
            echo "SCCACHE_DIR=$RUNNER_TEMP/csa-patched-codex-cache/sccache"
            echo "SCCACHE_STATS=$root/sccache-stats.json"
          } >> "$GITHUB_ENV"
          mkdir -p "$root"

      - name: Clone exact reviewed upstream source
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rm -rf "$SOURCE_ROOT"
            if git clone --filter=blob:none --no-checkout \
              --branch '${{ inputs.upstream_tag }}' --single-branch \
              https://github.com/openai/codex.git "$SOURCE_ROOT"; then
              break
            fi
            [[ "$attempt" != 3 ]] || exit 1
            sleep $((attempt * 5))
          done
          git -C "$SOURCE_ROOT" checkout --detach '${{ inputs.upstream_commit }}'
          test "$(git -C "$SOURCE_ROOT" rev-parse HEAD)" = '${{ inputs.upstream_commit }}'
          test "$(git -C "$SOURCE_ROOT" rev-parse 'refs/tags/${{ inputs.upstream_tag }}^{commit}')" = '${{ inputs.upstream_commit }}'

      - name: Apply exact reviewed patch payload
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify_patch_payload.py \
            --manifest "$GITHUB_WORKSPACE/${{ inputs.manifest_path }}" \
            --source "$SOURCE_ROOT" --apply

      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          toolchain: ${{ inputs.rust_toolchain }}
          targets: ${{ inputs.target }}

      - uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.16.0

      - name: Configure shared sccache
        shell: bash
        run: |
          set -euo pipefail
          test -x "$SCCACHE_PATH"
          echo "RUSTC_WRAPPER=$SCCACHE_PATH" >> "$GITHUB_ENV"
          "$SCCACHE_PATH" --start-server
          "$SCCACHE_PATH" --zero-stats

      - name: Install Zig for musl
        if: contains(inputs.target, 'linux-musl')
        uses: mlugg/setup-zig@v2.2.1
        with:
          version: 0.14.0
          use-cache: false

      - name: Install upstream musl build tools
        if: contains(inputs.target, 'linux-musl')
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          bash "$SOURCE_ROOT/.github/scripts/install-musl-build-tools.sh"
          {
            echo "AWS_LC_SYS_NO_JITTER_ENTROPY=1"
            target_no_jitter="AWS_LC_SYS_NO_JITTER_ENTROPY_${TARGET//-/_}"
            echo "${target_no_jitter}=1"
          } >> "$GITHUB_ENV"

      - name: Configure rusty_v8 artifact overrides
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          cd "$SOURCE_ROOT/codex-rs"
          version="$(python "$SOURCE_ROOT/.github/scripts/rusty_v8_bazel.py" resolved-v8-crate-version)"
          base_url="https://github.com/openai/codex/releases/download/rusty-v8-v${version}"
          binding_dir="$RUNNER_TEMP/rusty_v8"
          profile=ptrcomp_sandbox_release
          if [[ "$TARGET" == *-pc-windows-msvc ]]; then
            archive_name="rusty_v8_${profile}_${TARGET}.lib.gz"
          else
            archive_name="librusty_v8_${profile}_${TARGET}.a.gz"
          fi
          binding_name="src_binding_${profile}_${TARGET}.rs"
          checksums_name="rusty_v8_${profile}_${TARGET}.sha256"
          mkdir -p "$binding_dir"
          curl -fsSL "$base_url/$archive_name" -o "$binding_dir/$archive_name"
          curl -fsSL "$base_url/$binding_name" -o "$binding_dir/$binding_name"
          curl -fsSL "$base_url/$checksums_name" -o "$binding_dir/$checksums_name"
          test "$(wc -l < "$binding_dir/$checksums_name")" -eq 2
          if command -v sha256sum >/dev/null 2>&1; then
            (cd "$binding_dir" && tr -d '\r' < "$checksums_name" | sha256sum -c -)
          else
            (cd "$binding_dir" && tr -d '\r' < "$checksums_name" | shasum -a 256 -c -)
          fi
          {
            echo "RUSTY_V8_ARCHIVE=$binding_dir/$archive_name"
            echo "RUSTY_V8_SRC_BINDING_PATH=$binding_dir/$binding_name"
          } >> "$GITHUB_ENV"

      - name: Configure MSVC environment
        if: contains(inputs.target, 'windows-msvc')
        shell: pwsh
        env:
          TARGET: ${{ inputs.target }}
        run: '& "$env:SOURCE_ROOT/.github/actions/setup-msvc-env/setup-msvc-env.ps1" -Target "$env:TARGET"'

      - name: Build Linux bwrap and export digest
        if: contains(inputs.target, 'linux-musl')
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          cd "$SOURCE_ROOT/codex-rs"
          cargo build --target "$TARGET" --release --timings --bin bwrap
          bwrap="$CARGO_TARGET_DIR/$TARGET/release/bwrap"
          strip --strip-debug --strip-unneeded "$bwrap"
          echo "CODEX_BWRAP_SHA256=$(sha256sum "$bwrap" | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: Build patched Codex CLI
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          cd "$SOURCE_ROOT/codex-rs"
          if [[ "$TARGET" == x86_64-pc-windows-msvc ]]; then
            export LIBSQLITE3_FLAGS=SQLITE_DISABLE_INTRINSIC
          fi
          cargo build --target "$TARGET" --release --timings --bin codex
          if [[ "$TARGET" == *-unknown-linux-musl ]]; then
            codex="$CARGO_TARGET_DIR/$TARGET/release/codex"
            before_size="$(stat -c %s "$codex")"
            strip --strip-debug --strip-unneeded "$codex"
            after_size="$(stat -c %s "$codex")"
            echo "Stripped Linux Codex CLI: ${before_size} -> ${after_size} bytes"
          fi

      - name: Verify shared sccache use
        shell: bash
        run: |
          set -euo pipefail
          "$SCCACHE_PATH" --show-stats --stats-format json > "$SCCACHE_STATS" || true
          python scripts/check_sccache_stats.py \
            --stats "$SCCACHE_STATS" \
            --profile release \
            --github-step-summary "$GITHUB_STEP_SUMMARY" \
            --require-requests
          "$SCCACHE_PATH" --show-stats || true

      - name: Stage exact target artifact
        shell: bash
        env:
          ARTIFACT_FILENAME: ${{ inputs.artifact_filename }}
          COMPAT_ID: ${{ inputs.compat_id }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          TARGET: ${{ inputs.target }}
          UPSTREAM_COMMIT: ${{ inputs.upstream_commit }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import shutil
          from pathlib import Path

          target = os.environ["TARGET"]
          filename = os.environ["ARTIFACT_FILENAME"]
          source = Path(os.environ["CARGO_TARGET_DIR"]) / target / "release" / filename
          root = Path(os.environ["TARGET_BUNDLE"])
          destination = root / "bin" / filename
          if not source.is_file():
              raise SystemExit(f"missing target artifact: {source}")
          destination.parent.mkdir(parents=True)
          shutil.copy2(source, destination)
          data = destination.read_bytes()
          record = {
              "schema": 1,
              "compat_id": os.environ["COMPAT_ID"],
              "target": target,
              "artifact": f"bin/{filename}",
              "size": len(data),
              "sha256": hashlib.sha256(data).hexdigest(),
              "upstream_commit": os.environ["UPSTREAM_COMMIT"],
              "source_commit": os.environ["SOURCE_COMMIT"],
          }
          (root / "target-record.json").write_text(
              json.dumps(record, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY

      - name: Upload target artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: patched-codex-target-${{ inputs.compat_id }}-${{ inputs.target }}
          path: ${{ env.TARGET_BUNDLE }}
          if-no-files-found: error
          compression-level: 0
          retention-days: ${{ inputs.retention_days }}
