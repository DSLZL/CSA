name: Validate patched Codex CLI

on:
  workflow_call:
    inputs:
      compat_selector:
        required: true
        type: string
      retention_days:
        required: false
        default: 14
        type: number
      target:
        required: true
        type: string
      source_commit:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      compat_selector:
        description: "current or one exact compatibility ID from release/compatibility-index.json"
        required: true
        default: current
        type: string
      target:
        description: Reviewed patched Codex target
        required: true
        default: x86_64-pc-windows-msvc
        type: string

concurrency:
  group: csa-patched-codex-validation-${{ github.ref }}-${{ inputs.target || 'x86_64-pc-windows-msvc' }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CSA_SOURCE_COMMIT: ${{ inputs.source_commit || github.sha }}
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: "false"
  SCCACHE_GHA_ENABLED: "on"
  SCCACHE_GHA_RW_MODE: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && 'READ_WRITE' || 'READ_ONLY' }}
  SCCACHE_GHA_VERSION: csa-patched-codex-v1

jobs:
  validate:
    name: Validate exact patched Codex contract
    runs-on: windows-2025
    timeout-minutes: 120
    permissions:
      actions: write
      contents: read
    steps:
      - name: Configure isolated validation roots
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'csa-patched-codex-validation'
          $tmp = Join-Path $env:RUNNER_TEMP 'csa-tmp'
          $paths = @{
            VALIDATION_ROOT = $root
            SOURCE_ROOT = Join-Path $root 'source'
            CARGO_TARGET_DIR = Join-Path $root 'cargo-target'
            CARGO_HOME = Join-Path $root 'cache/cargo-home'
            CSA_RUNTIME_CACHE = Join-Path $root 'cache/official-runtime'
            RUSTUP_HOME = Join-Path $root 'cache/rustup'
            SCCACHE_DIR = Join-Path $env:RUNNER_TEMP 'csa-patched-codex-cache/sccache'
            TEMP = $tmp
            TMP = $tmp
            HOME = Join-Path $root 'home'
            CODEX_HOME = Join-Path $root 'codex-home'
            RESOLUTION_JSON = Join-Path $root 'resolution.json'
            SCCACHE_STATS = Join-Path $root 'sccache-stats.json'
            TEST_REPORT = Join-Path $root 'bundle.tests.json'
            EVIDENCE_ROOT = Join-Path $root 'evidence'
          }
          foreach ($entry in $paths.GetEnumerator()) {
            "$($entry.Key)=$($entry.Value)" >> $env:GITHUB_ENV
          }
          New-Item -ItemType Directory -Force -Path @(
            $paths.HOME,
            $paths.CODEX_HOME,
            $paths.CSA_RUNTIME_CACHE,
            $paths.EVIDENCE_ROOT,
            $tmp
          ) | Out-Null

      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.source_commit || github.sha }}

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"

      - uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.16.0

      - id: resolve
        name: Resolve exact validation authority
        shell: pwsh
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REQUESTED_COMPAT_SELECTOR: ${{ inputs.compat_selector || 'current' }}
          REQUESTED_TARGET: ${{ inputs.target || 'x86_64-pc-windows-msvc' }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -ne $env:CSA_SOURCE_COMMIT) {
            throw 'Checked-out CSA commit differs from the requested source commit.'
          }
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch' -and $env:GITHUB_REF_NAME -ne $env:DEFAULT_BRANCH) {
            throw "Patched Codex validation must be dispatched from '$env:DEFAULT_BRANCH'."
          }
          python scripts/compat_catalog.py resolve `
            --repository . `
            --selector $env:REQUESTED_COMPAT_SELECTOR `
            --target $env:REQUESTED_TARGET `
            --output $env:RESOLUTION_JSON `
            --github-output $env:GITHUB_OUTPUT
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/compat_catalog.py validate --repository .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Clone exact reviewed upstream source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = [IO.Path]::GetFullPath($env:SOURCE_ROOT)
          $runner = [IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd('\') + '\'
          $workspace = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE).TrimEnd('\') + '\'
          if (-not ($source + '\').StartsWith($runner, [StringComparison]::OrdinalIgnoreCase)) {
            throw "Codex source must live below RUNNER_TEMP: $source"
          }
          if (($source + '\').StartsWith($workspace, [StringComparison]::OrdinalIgnoreCase)) {
            throw "Codex source must not live inside the CSA repository: $source"
          }
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            Remove-Item -Recurse -Force -LiteralPath $source -ErrorAction SilentlyContinue
            git clone --filter=blob:none --no-checkout `
              --branch '${{ steps.resolve.outputs.upstream_tag }}' --single-branch `
              https://github.com/openai/codex.git $source
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq 3) { throw "Pinned upstream clone failed after $attempt attempts." }
            Start-Sleep -Seconds (5 * $attempt)
          }
          git -C $source checkout --detach '${{ steps.resolve.outputs.upstream_commit }}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $tagCommit = (git -C $source rev-parse 'refs/tags/${{ steps.resolve.outputs.upstream_tag }}^{commit}').Trim()
          $headCommit = (git -C $source rev-parse HEAD).Trim()
          if ($tagCommit -ne '${{ steps.resolve.outputs.upstream_commit }}' -or $headCommit -ne $tagCommit) {
            throw 'Pinned upstream tag and commit identity differ.'
          }

      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: ${{ steps.resolve.outputs.build_target }}
          components: rustfmt, clippy

      - name: Configure native MSVC environment
        shell: pwsh
        env:
          TARGET: ${{ steps.resolve.outputs.build_target }}
        run: '& "$env:SOURCE_ROOT/.github/actions/setup-msvc-env/setup-msvc-env.ps1" -Target "$env:TARGET"'

      - name: Configure shared sccache and verify Rust identity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sccache = $env:SCCACHE_PATH
          if (-not (Test-Path -LiteralPath $sccache -PathType Leaf) -and (Test-Path -LiteralPath "$sccache.exe" -PathType Leaf)) {
            $sccache = "$sccache.exe"
          }
          if (-not (Test-Path -LiteralPath $sccache -PathType Leaf)) {
            throw "sccache executable is missing: $sccache"
          }
          $sccacheVersion = (& $sccache --version).Trim()
          if ($LASTEXITCODE -ne 0 -or $sccacheVersion -ne 'sccache ${{ steps.resolve.outputs.sccache_version }}') {
            throw "sccache identity mismatch: $sccacheVersion"
          }
          $rustcIdentity = rustc -Vv | Out-String
          if ($LASTEXITCODE -ne 0 -or -not $rustcIdentity.Contains('commit-hash: ${{ steps.resolve.outputs.rustc_commit }}')) {
            throw 'Rust compiler commit does not match the compatibility manifest.'
          }
          "SCCACHE_PATH=$sccache" >> $env:GITHUB_ENV
          "RUSTC_WRAPPER=$sccache" >> $env:GITHUB_ENV
          & $sccache --start-server
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $sccache --zero-stats

      - name: Verify exact official runtime archive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $runtime = (Get-Content -Raw -LiteralPath $env:RESOLUTION_JSON | ConvertFrom-Json).runtime
          $archive = Join-Path $env:CSA_RUNTIME_CACHE 'official-runtime.tgz'
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            try {
              Invoke-WebRequest -Uri $runtime.archive_url -OutFile $archive -MaximumRedirection 5
              break
            } catch {
              Remove-Item -Force -LiteralPath $archive -ErrorAction SilentlyContinue
              if ($attempt -eq 3) { throw }
              Start-Sleep -Seconds (5 * $attempt)
            }
          }
          $integrity = $runtime.integrity -split '-', 2
          if ($integrity.Count -ne 2 -or $integrity[0] -cne 'sha512') {
            throw 'Official runtime lock has an unsupported integrity algorithm.'
          }
          $stream = [IO.File]::OpenRead($archive)
          $sha512 = [Security.Cryptography.SHA512]::Create()
          try {
            $actual = [Convert]::ToBase64String($sha512.ComputeHash($stream))
          } finally {
            $sha512.Dispose()
            $stream.Dispose()
          }
          if ($actual -cne $integrity[1]) {
            throw 'Official runtime archive integrity differs from the reviewed lock.'
          }
          $members = @(tar -tzf $archive)
          if ($LASTEXITCODE -ne 0) { throw 'Official runtime archive cannot be listed.' }
          foreach ($required in @($runtime.required_files)) {
            if ($members -cnotcontains $required) {
              throw "Official runtime archive is missing reviewed member: $required"
            }
          }

      - name: Run complete patch generation and contract tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = Join-Path $env:GITHUB_WORKSPACE '${{ steps.resolve.outputs.manifest_path }}'
          python scripts/run_patch_contract.py `
            --manifest $manifest `
            --source $env:SOURCE_ROOT `
            --cargo-target $env:CARGO_TARGET_DIR `
            --output $env:TEST_REPORT `
            --portable-evidence `
            --phase tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Report shared sccache use
        shell: pwsh
        env:
          CSA_SCCACHE_PROFILE: test
          CSA_MINIMUM_RUST_HIT_RATE: 95
        run: |
          $ErrorActionPreference = 'Continue'
          $stats = & $env:SCCACHE_PATH --show-stats --stats-format json
          if ($LASTEXITCODE -eq 0) {
            [IO.File]::WriteAllLines(
              $env:SCCACHE_STATS,
              $stats,
              [Text.UTF8Encoding]::new($false)
            )
            python scripts/check_sccache_stats.py `
              --stats $env:SCCACHE_STATS `
              --minimum-rust-hit-rate $env:CSA_MINIMUM_RUST_HIT_RATE `
              --profile $env:CSA_SCCACHE_PROFILE `
              --github-step-summary $env:GITHUB_STEP_SUMMARY
            if ($LASTEXITCODE -ne 0) { Write-Warning 'sccache statistics did not meet the advisory threshold.' }
          } else {
            Write-Warning 'sccache statistics are unavailable.'
          }
          & $env:SCCACHE_PATH --show-stats

      - name: Create exact validation evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $testReport = Join-Path $env:EVIDENCE_ROOT 'test-report.json'
          $validationResult = Join-Path $env:EVIDENCE_ROOT 'validation-result.json'
          Copy-Item -LiteralPath $env:TEST_REPORT -Destination $testReport
          python scripts/validation_evidence.py create `
            --repository . `
            --resolution $env:RESOLUTION_JSON `
            --test-report $testReport `
            --csa-commit $env:CSA_SOURCE_COMMIT `
            --workflow-run-id $env:GITHUB_RUN_ID `
            --workflow-run-attempt $env:GITHUB_RUN_ATTEMPT `
            --output $validationResult
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload validation evidence
        uses: actions/upload-artifact@v7.0.1
        with:
          name: patched-codex-validation-${{ steps.resolve.outputs.compat_id }}
          path: ${{ runner.temp }}/csa-patched-codex-validation/evidence
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days || 14 }}
