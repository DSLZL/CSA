name: Setup Manager Rust cache
description: Restore Cargo downloads and the local CSA Manager sccache archive without restoring target artifacts.

inputs:
  cache-scope:
    description: Stable CSA Manager dependency scope, such as the Cargo.lock hash.
    required: true
  toolchain:
    description: Rust toolchain identifier used in the cache key.
    required: false
    default: "1.95.0"

runs:
  using: composite
  steps:
    - name: Configure isolated Cargo home
      id: cargo-home
      shell: pwsh
      run: |
        $cargoHome = Join-Path $env:RUNNER_TEMP "csa-cargo-home"
        $sccacheDir = Join-Path $env:RUNNER_TEMP "csa-sccache"
        New-Item -ItemType Directory -Force $cargoHome, $sccacheDir | Out-Null
        "CARGO_HOME=$cargoHome" | Add-Content -Path $env:GITHUB_ENV -Encoding utf8
        "SCCACHE_DIR=$sccacheDir" | Add-Content -Path $env:GITHUB_ENV -Encoding utf8
        "path=$cargoHome" | Add-Content -Path $env:GITHUB_OUTPUT -Encoding utf8
        "sccache-path=$sccacheDir" | Add-Content -Path $env:GITHUB_OUTPUT -Encoding utf8

    - name: Restore Cargo registry and git downloads
      uses: actions/cache@v6.1.0
      with:
        path: |
          ${{ steps.cargo-home.outputs.path }}/registry/index
          ${{ steps.cargo-home.outputs.path }}/registry/cache
          ${{ steps.cargo-home.outputs.path }}/git/db
        key: csa-cargo-home-v5-${{ runner.os }}-${{ runner.arch }}-${{ inputs.toolchain }}-${{ inputs.cache-scope }}-${{ github.sha }}
        restore-keys: |
          csa-cargo-home-v5-${{ runner.os }}-${{ runner.arch }}-${{ inputs.toolchain }}-${{ inputs.cache-scope }}-
          csa-cargo-home-v5-${{ runner.os }}-${{ runner.arch }}-${{ inputs.toolchain }}-

    - name: Restore updateable local compiler cache
      uses: actions/cache@v6.1.0
      with:
        path: ${{ steps.cargo-home.outputs.sccache-path }}
        key: csa-sccache-local-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.toolchain }}-${{ inputs.cache-scope }}-${{ github.sha }}
        restore-keys: |
          csa-sccache-local-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.toolchain }}-${{ inputs.cache-scope }}-

    - name: Install pinned sccache
      uses: mozilla-actions/sccache-action@v0.0.11
      with:
        version: "v0.16.0"

    - name: Enable local compiler cache
      shell: pwsh
      run: |
        "CARGO_BUILD_JOBS=$([Environment]::ProcessorCount)" | Add-Content -Path $env:GITHUB_ENV -Encoding utf8
        "RUSTC_WRAPPER=sccache" | Add-Content -Path $env:GITHUB_ENV -Encoding utf8
        "SCCACHE_CACHE_SIZE=1G" | Add-Content -Path $env:GITHUB_ENV -Encoding utf8
        "CARGO_INCREMENTAL=0" | Add-Content -Path $env:GITHUB_ENV -Encoding utf8
