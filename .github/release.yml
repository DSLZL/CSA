changelog:
  categories:
    - title: New Features
      labels:
        - feature
        - enhancement
    - title: Bug Fixes
      labels:
        - bug
        - fix
    - title: CLI
      labels:
        - cli
    - title: Performance
      labels:
        - performance
    - title: Build & Release
      labels:
        - ci
        - build
        - release
    - title: Documentation
      labels:
        - documentation
    - title: Other Changes
      labels:
        - "*"
  exclude:
    labels:
      - skip-changelog
      - dependencies
